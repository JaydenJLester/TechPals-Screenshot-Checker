<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot Checker</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="page-container">
        <section class="main-card" aria-labelledby="pageTitle">
            <header class="page-header">
                <h1 id="pageTitle">Screenshot Checker</h1>
            </header>

            <div class="checker-grid">
                <section class="form-panel upload-panel" aria-labelledby="uploadTitle">
                    <h2 id="uploadTitle">Upload Screenshot</h2>

                    <label for="screenshotUpload" class="upload-box">
                        <span class="upload-icon" aria-hidden="true">↑</span>
                        <span class="upload-copy">
                            <span class="upload-title">Choose Screenshot</span>
                            <span class="upload-subtitle">PNG, JPG, JPEG, or WEBP under 5 MB</span>
                        </span>
                    </label>

                    <input
                        type="file"
                        id="screenshotUpload"
                        accept="image/png, image/jpeg, image/jpg, image/webp"
                        hidden
                    />

                    <div id="previewArea" class="preview-area hidden">
                        <div class="preview-header">
                            <div class="file-details">
                                <p id="fileName" class="file-name"></p>
                                <p id="fileSize" class="file-size"></p>
                            </div>

                            <button id="deleteImageBtn" class="secondary-button compact-button" type="button">
                                Delete image
                            </button>
                        </div>

                        <img id="imagePreview" class="image-preview" alt="Uploaded screenshot preview" />
                    </div>
                </section>

                <section id="questionPanel" class="form-panel question-panel" aria-labelledby="questionTitle">
                    <div class="question-heading">
                        <h2 id="questionTitle">What would you like help with?</h2>
                        <p>(Optional)</p>
                    </div>

                    <div class="question-options">
                        <label class="question-card">
                            <input type="radio" name="questionType" value="meaning" />
                            <span>What does this mean?</span>
                        </label>

                        <label class="question-card">
                            <input type="radio" name="questionType" value="safety" />
                            <span>Is this safe?</span>
                        </label>

                        <label class="question-card">
                            <input type="radio" name="questionType" value="action" />
                            <span>What should I do?</span>
                        </label>

                        <label class="question-card">
                            <input type="radio" name="questionType" value="other" />
                            <span>Something else</span>
                        </label>
                    </div>

                    <div id="followUpArea" class="follow-up-area is-disabled">
                        <label for="followUpQuestion">Tell us what’s worrying you</label>
                        <textarea
                            id="followUpQuestion"
                            rows="1"
                            placeholder="Select Something else button to add details."
                            aria-expanded="false"
                            aria-disabled="true"
                            tabindex="-1"
                            readonly
                            disabled
                        ></textarea>
                    </div>
                </section>
            </div>

            <div id="errorMessage" class="error-message hidden" role="alert"></div>

            <div class="button-row">
                <button id="checkBtn" class="primary-button" type="button">
                    Check Screenshot
                </button>
            </div>
        </section>

        <section id="resultCard" class="result-card hidden" aria-live="polite">
            <div class="main-answer">
                <p class="eyebrow">Screenshot Checker Response</p>
                <div id="resultContent">
                    <!-- AI response will appear here -->
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
